name: amana_pos
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^9.2.1

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.1
  system_info_plus: ^0.0.6

  # UI / Assets
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.0

  # Network
  dio: ^5.5.0+1
  mime: ^2.0.0

  # Utils
  intl: ^0.20.2
  fpdart: ^1.1.0
  collection: ^1.19.1
  uuid: ^4.5.1
  crypto: ^3.0.6

  # Image / Permissions
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Offline-first MVP
  sqflite: ^2.4.2        # was exact pin "2.4.2" — allows patch releases
  path: ^1.9.1
  connectivity_plus: ^7.0.0  # was ^6.1.4 — allows the current 7.x line
  path_provider: ^2.1.5
  # Background sync worker (Android WorkManager / iOS BGTaskScheduler).
  workmanager: 0.10.10

  # Firebase
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.1
  flutter_local_notifications: ^17.2.3


  # Analytics
  firebase_analytics: ^12.0.1

  # barcode scanner
  mobile_scanner: ^7.1.4

  share_plus: ^13.1.0
  url_launcher: ^6.3.0
  pdf: ^3.12.0
  cross_file: ^0.3.5+2
  printing: ^5.13.2
  print_bluetooth_thermal: ^1.2.1
  flutter_blue_plus: ^1.35.5  # pinned to 1.x: BSD-3 license (2.x requires a paid commercial license)
  local_auth: ^3.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.3.3
  fake_async: ^1.3.3 # already locked transitively via flutter_test; direct for the depend_on_referenced_packages lint


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Bold.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700